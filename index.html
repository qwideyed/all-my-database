<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniTrack | Universal Media Vault</title>

  <!-- Google Material Symbols -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    :root {
      --bg: #070a12;
      --card-bg: rgba(18, 25, 41, 0.72);
      --card-border: rgba(255, 255, 255, 0.07);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.28);
      --text: #f8fafc;
      --muted: #94a3b8;
      --bubble-bg: #151e33;
      --bubble-hover: #223050;
      --danger: #fb7185;
      --radius: 20px;
      --transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2.2rem 1.25rem 6rem;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 750px;
      height: 420px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.14), transparent 70%);
      z-index: 0;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 1.8rem;
    }

    /* --- Header Bar --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.4rem;
      border-bottom: 1px solid var(--card-border);
      position: relative;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.2), rgba(14, 165, 233, 0.05));
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .brand h1 {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.4px;
    }

    .brand h1 span { color: var(--accent); }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--bubble-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
    }

    .icon-button:hover {
      background: var(--bubble-hover);
      border-color: rgba(56, 189, 248, 0.4);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    /* --- Settings Gear Hover Dropdown --- */
    .settings-wrapper {
      position: relative;
    }

    .settings-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 200px;
      background: #111827;
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 0.5rem;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transform: translateY(-8px);
      transition: var(--transition);
      z-index: 60;
    }

    .settings-wrapper:hover .settings-dropdown {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dropdown-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.65rem 0.85rem;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 0.86rem;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      text-align: left;
      transition: var(--transition);
    }

    .dropdown-btn:hover {
      background: var(--bubble-hover);
      color: var(--accent);
    }

    /* --- Toolbar: Filters & 18+ Toggle --- */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .filter-pills {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.25rem;
    }

    .pill-btn {
      background: var(--bubble-bg);
      border: 1px solid var(--card-border);
      color: var(--muted);
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--transition);
    }

    .pill-btn:hover {
      background: var(--bubble-hover);
      color: var(--text);
    }

    .pill-btn.active {
      background: var(--accent);
      color: #04101e;
      font-weight: 700;
      border-color: var(--accent);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .blur-control {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.84rem;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .blur-control input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* --- Media Grid & Upgraded Description Cards --- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.4rem;
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(56, 189, 248, 0.35);
      box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
    }

    .card-top {
      display: flex;
      height: 170px;
      position: relative;
      background: #0f1627;
      overflow: hidden;
    }

    .card-thumb {
      width: 120px;
      height: 100%;
      object-fit: cover;
      flex-shrink: 0;
      transition: 0.3s ease;
    }

    .card-top-info {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      overflow: hidden;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 700;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .badge-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      margin-top: 0.4rem;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.72rem;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .tag.accent {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .card-body {
      padding: 1rem 1.1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      flex: 1;
    }

    .card-description {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.65rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      margin-top: auto;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .rating {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      color: #facc15;
      font-weight: 700;
    }

    .delete-action {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      padding: 0.3rem;
      border-radius: 8px;
      transition: var(--transition);
    }

    .delete-action:hover {
      color: var(--danger);
      background: rgba(251, 113, 133, 0.12);
    }

    .blur-nsfw {
      filter: blur(16px) brightness(0.8);
    }

    .blur-nsfw:hover {
      filter: blur(0) brightness(1);
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 6rem 1rem;
      color: var(--muted);
    }

    /* --- Search & Discover Pop-up Overlay --- */
    .overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 4rem 1.25rem 2rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
      z-index: 100;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .search-modal {
      background: #101726;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 1.5rem;
      max-width: 620px;
      width: 100%;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      transform: translateY(-15px);
      transition: transform 0.22s ease;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-height: 80vh;
    }

    .overlay.active .search-modal {
      transform: translateY(0);
    }

    .search-input-box {
      display: flex;
      align-items: center;
      background: var(--bubble-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 0.4rem 0.85rem;
      gap: 0.6rem;
      transition: var(--transition);
    }

    .search-input-box:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .search-input-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      padding: 0.5rem 0;
    }

    .search-type-select {
      background: #0d1322;
      border: 1px solid var(--card-border);
      color: var(--muted);
      border-radius: 8px;
      padding: 0.4rem 0.6rem;
      font-size: 0.8rem;
      outline: none;
    }

    .results-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      padding-right: 0.3rem;
    }

    .result-row {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      padding: 0.65rem;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: var(--transition);
    }

    .result-row:hover {
      background: var(--bubble-hover);
      border-color: rgba(56, 189, 248, 0.3);
      transform: translateX(4px);
    }

    .result-thumb {
      width: 48px;
      height: 64px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background: #070a12;
    }

    .result-info {
      flex: 1;
      overflow: hidden;
    }

    .result-info h4 {
      font-size: 0.94rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .result-info p {
      font-size: 0.78rem;
      color: var(--muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 0.2rem;
    }

    .save-badge {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.4rem 0.75rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      font-size: 0.76rem;
      font-weight: 600;
      flex-shrink: 0;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <header>
      <div class="brand">
        <div class="brand-icon">
          <span class="material-symbols-rounded">movie_filter</span>
        </div>
        <h1>Omni<span>Vault</span></h1>
      </div>

      <div class="header-actions">
        <!-- Search Trigger Icon Button -->
        <button class="icon-button" id="openSearchBtn" title="Search & Add Media">
          <span class="material-symbols-rounded">search</span>
        </button>

        <!-- Gear Settings Dropdown on Hover -->
        <div class="settings-wrapper">
          <button class="icon-button" title="Vault Settings">
            <span class="material-symbols-rounded">settings</span>
          </button>
          <div class="settings-dropdown">
            <button class="dropdown-btn" id="exportBtn">
              <span class="material-symbols-rounded" style="color: var(--accent); font-size: 1.1rem;">download</span>
              Export Backup
            </button>
            <button class="dropdown-btn" onclick="document.getElementById('fileInput').click()">
              <span class="material-symbols-rounded" style="color: #34d399; font-size: 1.1rem;">upload</span>
              Import Backup
            </button>
            <input type="file" id="fileInput" accept=".json" style="display: none;" />
          </div>
        </div>
      </div>
    </header>

    <!-- Toolbar Filters -->
    <div class="toolbar">
      <div class="filter-pills">
        <button class="pill-btn active" data-filter="all">All</button>
        <button class="pill-btn" data-filter="anime">Anime</button>
        <button class="pill-btn" data-filter="manga">Manga</button>
        <button class="pill-btn" data-filter="hentai">Hentai (18+)</button>
        <button class="pill-btn" data-filter="movie">Movies</button>
        <button class="pill-btn" data-filter="show">Shows</button>
      </div>

      <label class="blur-control">
        <input type="checkbox" id="nsfwBlur" checked />
        <span>Blur 18+ Covers</span>
      </label>
    </div>

    <!-- Media Cards Grid -->
    <main class="grid" id="cardsGrid"></main>
  </div>

  <!-- Search Pop-up Overlay -->
  <div class="overlay" id="searchOverlay">
    <div class="search-modal">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 1.15rem; font-weight: 700;">Find & Add Media</h3>
        <button class="icon-button" id="closeSearchBtn" style="width: 34px; height: 34px;">
          <span class="material-symbols-rounded" style="font-size: 1.2rem;">close</span>
        </button>
      </div>

      <div class="search-input-box">
        <span class="material-symbols-rounded" style="color: var(--muted);" id="searchIndicator">search</span>
        <input type="text" id="searchInput" placeholder="Type title (e.g. Solo Leveling, Bleach, Inception)..." autocomplete="off" />
        <select id="apiCategory" class="search-type-select">
          <option value="anime">Anime</option>
          <option value="manga">Manga</option>
          <option value="hentai">Hentai (18+)</option>
          <option value="movie">Movies</option>
          <option value="show">TV Shows</option>
        </select>
      </div>

      <div class="results-list" id="searchResults">
        <div style="text-align: center; color: var(--muted); padding: 2rem 0; font-size: 0.88rem;">
          Type in the box above to pull live results directly into your vault.
        </div>
      </div>
    </div>
  </div>

  <script>
    /* State */
    let library = JSON.parse(localStorage.getItem('omnivault_db')) || [];
    let currentCategory = 'all';
    let debounceTimer = null;

    const cardsGrid = document.getElementById('cardsGrid');
    const filterBtns = document.querySelectorAll('.pill-btn');
    const nsfwBlur = document.getElementById('nsfwBlur');

    const searchOverlay = document.getElementById('searchOverlay');
    const openSearchBtn = document.getElementById('openSearchBtn');
    const closeSearchBtn = document.getElementById('closeSearchBtn');
    const searchInput = document.getElementById('searchInput');
    const apiCategory = document.getElementById('apiCategory');
    const searchResults = document.getElementById('searchResults');
    const searchIndicator = document.getElementById('searchIndicator');

    /* Render Vault Cards */
    function renderVault() {
      cardsGrid.innerHTML = '';
      const items = library.filter(i => currentCategory === 'all' || i.type === currentCategory);

      if (items.length === 0) {
        cardsGrid.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-rounded" style="font-size: 3.5rem; opacity: 0.3; margin-bottom: 0.5rem;">auto_stories</span>
            <p>Your vault is empty in this category. Click the search icon above to add your first title!</p>
          </div>
        `;
        return;
      }

      items.forEach(item => {
        const isHentai = item.type === 'hentai';
        const applyBlur = isHentai && nsfwBlur.checked;
        const poster = item.cover || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&q=80';
        const desc = item.desc || 'No description provided for this entry.';

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <div class="card-top">
            <img src="${poster}" alt="${item.title}" class="card-thumb ${applyBlur ? 'blur-nsfw' : ''}" loading="lazy" />
            <div class="card-top-info">
              <div>
                <h3 class="card-title" title="${item.title}">${item.title}</h3>
                <div class="badge-row">
                  <span class="tag accent">${item.type}</span>
                  <span class="tag">${item.status || 'Saved'}</span>
                </div>
              </div>
              <div class="rating">
                <span class="material-symbols-rounded" style="font-size: 1rem;">star</span>
                ${item.score || '9.0'}
              </div>
            </div>
          </div>
          <div class="card-body">
            <p class="card-description">${desc.replace(/<[^>]*>?/gm, '')}</p>
            <div class="card-footer">
              <span>Added: ${item.date || 'Recently'}</span>
              <button class="delete-action" onclick="removeEntry('${item.id}')" title="Delete">
                <span class="material-symbols-rounded" style="font-size: 1.15rem;">delete</span>
              </button>
            </div>
          </div>
        `;
        cardsGrid.appendChild(card);
      });
    }

    /* Search Pop-up Handlers */
    openSearchBtn.onclick = () => {
      searchOverlay.classList.add('active');
      searchInput.focus();
    };

    closeSearchBtn.onclick = () => searchOverlay.classList.remove('active');

    searchOverlay.onclick = (e) => {
      if (e.target === searchOverlay) searchOverlay.classList.remove('active');
    };

    /* Live API Search Engine */
    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const query = searchInput.value.trim();
      const type = apiCategory.value;

      if (query.length < 2) {
        searchResults.innerHTML = '<div style="text-align:center;color:var(--muted);padding:2rem 0;font-size:0.88rem;">Type to start searching...</div>';
        return;
      }

      debounceTimer = setTimeout(() => executeSearch(query, type), 300);
    });

    apiCategory.addEventListener('change', () => {
      if (searchInput.value.trim().length >= 2) {
        executeSearch(searchInput.value.trim(), apiCategory.value);
      }
    });

    async function executeSearch(query, type) {
      searchIndicator.style.animation = 'spin 1s linear infinite';
      searchResults.innerHTML = '<div style="text-align:center;color:var(--muted);padding:2rem 0;">Searching...</div>';

      try {
        if (type === 'anime' || type === 'manga' || type === 'hentai') {
          const gql = `
            query ($q: String, $type: MediaType, $adult: Boolean) {
              Page(perPage: 6) {
                media(search: $q, type: $type, isAdult: $adult) {
                  title { english romaji }
                  coverImage { large }
                  description
                  averageScore
                }
              }
            }
          `;
          const variables = {
            q: query,
            type: type === 'manga' ? 'MANGA' : 'ANIME',
            adult: type === 'hentai'
          };
          const res = await fetch('https://graphql.anilist.co', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ query: gql, variables })
          });
          const json = await res.json();
          renderResults((json?.data?.Page?.media || []).map(m => ({
            title: m.title.english || m.title.romaji,
            cover: m.coverImage.large,
            desc: m.description,
            score: m.averageScore ? (m.averageScore / 10).toFixed(1) : '8.5',
            type
          })));

        } else if (type === 'show') {
          const res = await fetch(`https://api.tvmaze.com/search/shows?q=${encodeURIComponent(query)}`);
          const json = await res.json();
          renderResults(json.slice(0, 6).map(s => ({
            title: s.show.name,
            cover: s.show.image?.medium || s.show.image?.original || '',
            desc: s.show.summary,
            score: s.show.rating?.average ? s.show.rating.average.toFixed(1) : '8.0',
            type: 'show'
          })));

        } else if (type === 'movie') {
          const res = await fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=movie&limit=6`);
          const json = await res.json();
          renderResults((json.results || []).map(m => ({
            title: m.trackName,
            cover: m.artworkUrl100 ? m.artworkUrl100.replace('100x100bb', '600x600bb') : '',
            desc: m.longDescription || 'No description available.',
            score: '8.2',
            type: 'movie'
          })));
        }
      } catch (err) {
        searchResults.innerHTML = '<div style="text-align:center;color:var(--danger);padding:2rem 0;">Search service temporary error.</div>';
      } finally {
        searchIndicator.style.animation = 'none';
      }
    }

    function renderResults(items) {
      if (!items || items.length === 0) {
        searchResults.innerHTML = '<div style="text-align:center;color:var(--muted);padding:2rem 0;">No results found.</div>';
        return;
      }

      searchResults.innerHTML = '';
      items.forEach(item => {
        const row = document.createElement('div');
        row.className = 'result-row';
        row.innerHTML = `
          <img src="${item.cover || 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=100&q=80'}" class="result-thumb" />
          <div class="result-info">
            <h4>${item.title}</h4>
            <p>${(item.desc || '').replace(/<[^>]*>?/gm, '')}</p>
          </div>
          <span class="save-badge">
            <span class="material-symbols-rounded" style="font-size: 1rem;">add</span> Add
          </span>
        `;
        row.onclick = () => {
          addEntryToVault(item);
          searchOverlay.classList.remove('active');
        };
        searchResults.appendChild(row);
      });
    }

    /* Vault State Mutations */
    function addEntryToVault(item) {
      library.unshift({
        id: Date.now().toString(),
        title: item.title,
        type: item.type,
        cover: item.cover,
        desc: item.desc,
        score: item.score,
        status: 'In Progress',
        date: new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
      });
      saveDB();
      renderVault();
    }

    window.removeEntry = function(id) {
      library = library.filter(i => i.id !== id);
      saveDB();
      renderVault();
    };

    function saveDB() {
      localStorage.setItem('omnivault_db', JSON.stringify(library));
    }

    /* Filter pills */
    filterBtns.forEach(btn => {
      btn.onclick = () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-filter');
        renderVault();
      };
    });

    nsfwBlur.onchange = () => renderVault();

    /* Backup Import & Export */
    document.getElementById('exportBtn').onclick = () => {
      if (library.length === 0) return alert('Vault is empty.');
      const blob = new Blob([JSON.stringify(library, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `omnivault_backup_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    };

    document.getElementById('fileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const imported = JSON.parse(event.target.result);
          if (Array.isArray(imported)) {
            const existing = new Set(library.map(i => i.id));
            const fresh = imported.filter(i => !existing.has(i.id));
            library = [...fresh, ...library];
            saveDB();
            renderVault();
            alert(`Loaded ${fresh.length} entries successfully.`);
          }
        } catch (err) {
          alert('Could not read JSON backup file.');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    };

    renderVault();
  </script>
</body>
</html>
